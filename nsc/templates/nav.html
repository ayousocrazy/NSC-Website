        <!-- Desktop Nav -->
        <div class="header-content">
            <div class="header-nav-external">
                <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
                <a href="{% url 'admissions' %}" class="{% if request.resolver_match.url_name == 'admissions' %}active{% endif %}">Admissions</a>

                <a href="{% url 'faqs' %}" class="{% if request.resolver_match.url_name == 'faqs' %}active{% endif %}">FAQs</a>

            <div class="desktop-buttons">
                <a href="#"><span class="header-btn">Plus 2</span></a>
                <a href="#"><span class="header-btn primary">Apply</span></a>
            </div>
        </div>

        <!-- Burger Button -->
        <div class="header_burger-button">
            <span></span>
        </div>
    </div>

    <!-- Drawer -->
    <div class="header_burger">
        <div class="header_burger-content">
            <div class="header-nav-external">
                <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>

        <div class="header-nav-internal">

<script>
    const burgerBtn = document.querySelector(".header_burger-button");
    const burgerMenu = document.querySelector(".header_burger");

    burgerBtn.addEventListener("click", () => {
        burgerMenu.classList.toggle("active");
        document.body.classList.toggle("menu-open");
    });
</script>
